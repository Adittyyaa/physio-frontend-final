<text xml:space="preserve" text-anchor="middle" x="1051" y="-686.6" font-family="Arial Bold" font-size="12.00" fill="#333333"> DATA ISOLATION:</text>
<text xml:space="preserve" text-anchor="middle" x="1051" y="-672.35" font-family="Arial Bold" font-size="12.00" fill="#333333"> Each therapist&#39;s data is completely separate</text>
<text xml:space="preserve" text-anchor="middle" x="1051" y="-658.1" font-family="Arial Bold" font-size="12.00" fill="#333333"> RLS (Row Level Security) enforces this</text>
<text xml:space="preserve" text-anchor="middle" x="1051" y="-629.85" font-family="Arial Bold" font-size="12.00" fill="#333333"> PATIENT PORTAL:</text>
